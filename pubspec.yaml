name: flutter_todo_app
description: A senior-level Flutter task manager. Clean architecture, repository pattern, local persistence, search, categories, due dates, priorities, sorting, dark mode, unit tests and CI.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
